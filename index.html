<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#242736; --border:#2e3244;
  --text:#e4e6ef; --text-muted:#8b8fa3;
  --accent:#6366f1; --accent-hover:#818cf8;
  --success:#22c55e; --warning:#f59e0b; --danger:#ef4444; --info:#3b82f6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

.header { background:var(--surface); border-bottom:1px solid var(--border); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:10px; }
.header h1 { font-size:20px; font-weight:600; display:flex; align-items:center; gap:10px; }
.header h1 .badge { background:var(--accent); color:white; font-size:12px; padding:2px 10px; border-radius:12px; font-weight:500; }
.header-actions { display:flex; gap:10px; align-items:center; }
.btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; transition:all .2s; }
.btn:hover { background:var(--border); }
.btn.active { background:var(--accent); border-color:var(--accent); color:white; }
.last-updated { font-size:12px; color:var(--text-muted); }

.tabs { display:flex; gap:4px; padding:12px 24px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.tab { padding:10px 18px; background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; font-weight:500; border-bottom:2px solid transparent; transition:all .2s; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }

.content { padding:20px 24px 60px; }

/* Totalizadores */
.totalizers { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; padding:16px 24px 0; }
@media (max-width:1300px) { .totalizers { grid-template-columns:repeat(3, 1fr); } }
@media (max-width:800px) { .totalizers { grid-template-columns:repeat(2, 1fr); } }
.tot-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
.tot-card .tot-label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.tot-card .tot-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.tot-card .tot-value { font-size:32px; font-weight:800; line-height:1; }
.tot-card .tot-sub { font-size:11px; color:var(--text-muted); margin-top:6px; }
.tot-card .tot-ps { display:flex; flex-direction:column; gap:4px; min-width:92px; }
.tot-card .tot-ps span { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:4px 10px; font-size:12px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }
.tot-card .tot-ps .lbl { color:var(--text-muted); }

/* Grid de células */
.cells-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
@media (max-width:1300px) { .cells-grid { grid-template-columns:repeat(2, 1fr); } }
@media (max-width:900px) { .cells-grid { grid-template-columns:1fr; } }

.cell-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
.cell-card.qa { border-color:#a855f7; }
.cell-card.pending { opacity:.75; border-style:dashed; }
.cell-header { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.cell-num { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:15px; flex-shrink:0; }
.cell-title { flex:1; min-width:0; }
.cell-title .mod { font-size:15px; font-weight:600; }
.cell-title .sub { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; }
.cell-body { padding:12px 16px; display:flex; flex-direction:column; gap:12px; flex:1; }

.members { display:flex; flex-wrap:wrap; gap:6px; }
.member { display:inline-flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:3px 10px 3px 3px; font-size:12px; }
.member .av { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:white; }

.nums { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.num-box { background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:9px 10px; text-align:center; }
.num-box .n { font-size:20px; font-weight:800; }
.num-box .l { font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }

.bar { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--surface2); border:1px solid var(--border); }
.bar-seg { min-width:0; transition:width .3s; }
.bar-legend { display:flex; flex-wrap:wrap; gap:8px 12px; }
.lg { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-muted); }
.lg .dot { width:9px; height:9px; border-radius:2px; }
.lg b { color:var(--text); }

.vs-box { background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:10px; }
.vs-box .vs-title { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.vs-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11px; }
.vs-row:last-child { margin-bottom:0; }
.vs-row .vs-lbl { width:66px; color:var(--text-muted); flex-shrink:0; }
.vs-track { flex:1; height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; }
.vs-fill { height:100%; border-radius:4px; }
.vs-pct { width:78px; text-align:right; font-weight:600; }

.sprint-list { display:flex; flex-direction:column; gap:4px; }
.sprint-row { display:flex; align-items:center; gap:8px; font-size:11.5px; background:var(--bg); border-radius:6px; padding:5px 9px; }
.sprint-row .sp-name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sprint-row .sp-n { font-weight:600; font-size:11px; color:var(--text-muted); }
.sprint-row .sp-n b { color:var(--text); }

.note { font-size:11px; color:var(--text-muted); background:var(--bg); border:1px dashed var(--border); border-radius:8px; padding:8px 10px; line-height:1.5; }

/* Tabla comparativa */
.table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; min-width:900px; }
th { text-align:left; padding:11px 14px; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface2); position:sticky; top:0; }
td { padding:10px 14px; border-bottom:1px solid var(--border); }
tr:last-child td { border-bottom:none; }
tr.baseline td { background:rgba(99,102,241,.08); font-weight:600; }
tr.tot td { background:var(--surface2); font-weight:700; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
.tag { display:inline-block; font-size:10px; padding:2px 7px; border-radius:4px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }

/* Grafico barras comparativo */
.chart-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:18px; }
.chart-card h2 { font-size:15px; font-weight:600; margin-bottom:4px; }
.chart-card .hint { font-size:11.5px; color:var(--text-muted); margin-bottom:16px; }
.hbar-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.hbar-lbl { width:150px; font-size:12.5px; flex-shrink:0; display:flex; align-items:center; gap:7px; }
.hbar-lbl .sq { width:10px; height:10px; border-radius:3px; }
.hbar-outer { flex:1; min-width:0; }
.hbar-track { display:flex; height:26px; background:var(--surface2); border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.hbar-p, .hbar-s { display:flex; align-items:center; justify-content:flex-end; padding-right:7px; font-size:10.5px; font-weight:700; color:#0f1117; }
.hbar-val { width:130px; text-align:right; font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.hbar-val b { color:var(--text); }
@media (max-width:820px) { .hbar-lbl { width:96px; font-size:11px; } .hbar-val { width:96px; font-size:11px; } }

.section-title { font-size:15px; font-weight:600; margin:24px 0 12px; display:flex; align-items:center; gap:8px; }
.section-title:first-child { margin-top:0; }
.section-title .cnt { font-size:11px; color:var(--text-muted); font-weight:500; }

.loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; color:var(--text-muted); }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px; }
@keyframes spin { to { transform:rotate(360deg); } }
.err { background:rgba(239,68,68,.1); border:1px solid var(--danger); color:#fca5a5; padding:10px 14px; border-radius:9px; font-size:12.5px; margin-bottom:14px; }
a.link { color:var(--accent); text-decoration:none; }
a.link:hover { text-decoration:underline; }

/* ---- Estado de servidores ---- */
.srv-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:6px; vertical-align:middle; background:#64748b; }
.srv-dot.ok { background:#22c55e; }
.srv-dot.deployando { background:#3b82f6; animation:srvPulse 1.2s ease-in-out infinite; }
.srv-dot.degradado { background:#eab308; }
.srv-dot.caido { background:#ef4444; animation:srvPulse .8s ease-in-out infinite; }
@keyframes srvPulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.srv-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-bottom:18px; }
.srv-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; border-left:4px solid #64748b; }
.srv-card.ok { border-left-color:#22c55e; }
.srv-card.deployando { border-left-color:#3b82f6; }
.srv-card.degradado { border-left-color:#eab308; }
.srv-card.caido { border-left-color:#ef4444; }
.srv-card h3 { margin:0 0 4px; font-size:15px; display:flex; align-items:center; gap:8px; }
.srv-estado { font-size:13px; font-weight:600; margin-bottom:8px; }
.srv-card.ok .srv-estado { color:#4ade80; }
.srv-card.deployando .srv-estado { color:#60a5fa; }
.srv-card.degradado .srv-estado { color:#facc15; }
.srv-card.caido .srv-estado { color:#f87171; }
.srv-meta { font-size:11.5px; color:var(--muted); line-height:1.7; }
.srv-meta b { color:var(--text); font-weight:600; }
.srv-hist { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.srv-hist table { width:100%; border-collapse:collapse; font-size:12.5px; }
.srv-hist th { text-align:left; padding:9px 14px; background:rgba(255,255,255,.03); color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
.srv-hist td { padding:9px 14px; border-top:1px solid var(--border); }
.srv-hist td.cuando { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.srv-alert-btn { background:transparent; border:1px solid var(--accent); color:var(--accent); padding:7px 13px; border-radius:8px; font-size:12px; cursor:pointer; }
.srv-alert-btn.on { background:var(--accent); color:#0b1220; }
</style>
</head>

    statuses:['to do','a revisar','pendiente','blockeado','blockeada','bloqueado','bloqueada','bloqueado - rev-fun','bloqueado - rev -fun','bloqueado - rev. fun','blocked'] },
  // "Reabierta" NO es trabajo de QA: el bug ya se pasó a los devs y queda asignado a ellos.

    statuses:['reabiertas','reabierta','reopened'] },

  { key:'revision', label:'En revisión (devs)', color:'#a855f7',

  // Los únicos estados en los que trabaja QA: el resto (pendiente, en curso,
  // bloqueado, reabierta, en revisión) es trabajo de los devs.

  { key:'terminado', label:'Terminado / Cerrado', color:'#22c55e',
    statuses:['done','closed','cerrado','terminado','complete','automation'] }
];
const BUCKET_OF = {};
BUCKETS.forEach(b => b.statuses.forEach(s => BUCKET_OF[s] = b.key));

function normStatus(s) { return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function bucketOf(s) { return BUCKET_OF[normStatus(s)] || 'pendiente'; }

// ============================================================
// STATE
// ============================================================
let DATA = [];          // [{cell, lists:[{id,name,parents,subs,buckets}], parents, subs, buckets, error}]
let currentTab = 'celulas';
let USED_SNAPSHOT = false;   // true si el proxy no respondió y se usó el snapshot embebido

// ============================================================
// FETCH
// ============================================================
// Último código de error visto, para que el cartel diga la causa real
// (401 = token del worker vencido, 429 = rate limit de ClickUp, otro = proxy caído).
let LAST_ERR = null;

// Semáforo global de requests: las células, sus listas y las páginas se piden en
// paralelo, y sin tope se llegaba a 50+ requests simultáneos → ClickUp devolvía 429
// (100 req/min) y el panel lo interpretaba como "token vencido".
const MAX_INFLIGHT = 6;
let inflight = 0;
const waiting = [];
function acquire() {
  if (inflight < MAX_INFLIGHT) { inflight++; return Promise.resolve(); }
  return new Promise(res => waiting.push(res));
}
function release() {
  const next = waiting.shift();
  if (next) next(); else inflight--;
}

// Sólo estos fallos justifican mostrar el snapshot embebido en lugar de los datos reales.
function accesoRoto() { return LAST_ERR === 401 || LAST_ERR === 403 || LAST_ERR === 'red'; }

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Reintenta 429 y 5xx con backoff: el 429 es transitorio, no un fallo de datos.
async function jget(path, tries = 4) {
  for (let i = 1; ; i++) {
    await acquire();
    let r;
    try { r = await fetch(PROXY + path); }
    catch (e) { release(); if (i >= tries) { LAST_ERR = 'red'; throw e; } await sleep(600 * i); continue; }
    finally { if (r) release(); }

    if (r.ok) return r.json();

    if ((r.status === 429 || r.status >= 500) && i < tries) {
      const ra = parseFloat(r.headers.get('retry-after') || '0');
      await sleep(ra > 0 ? ra * 1000 : 1200 * i);
      continue;
    }
    LAST_ERR = r.status;
    throw new Error('HTTP ' + r.status);
  }
}

async function listsOfFolder(folderId) {
  try {
    const d = await jget(`/api/folder/${folderId}/list`);
    if (d.lists && d.lists.length) {
      return d.lists.filter(l => !l.archived).map(l => ({ id:l.id, name:l.name }));
    }
  } catch (e) { console.warn('folder', folderId, e); }
  return FALLBACK_LISTS[folderId] || [];
}

// Paginación en bloques paralelos: cada página del proxy tarda 2-4s, y Sprint 8
// del Contable tiene ~14 páginas. En serie eso son ~40s sólo para esa lista.
const PAGE_CHUNK = 6;

function pageUrl(listId, page) {
  return `/api/tasks?list_id=${listId}&include_closed=true&subtasks=true&page=${page}`;
}

async function tasksOfList(listId) {
  const first = await jget(pageUrl(listId, 0));
  if (!first.tasks) return [];
  const out = [...first.tasks];
  if (first.last_page || first.tasks.length === 0) return out;

  let page = 1;
  while (page < 60) {
    const batch = [];
    for (let i = 0; i < PAGE_CHUNK && page < 60; i++, page++) batch.push(page);
    const res = await Promise.all(batch.map(p => jget(pageUrl(listId, p)).catch(() => null)));
    let stop = false;
    for (const d of res) {
      if (!d || !d.tasks) { stop = true; continue; }
      out.push(...d.tasks);
      if (d.last_page || d.tasks.length === 0) stop = true;   // cortar por last_page
    }
    if (stop) break;
  }
  return out;
}

function emptyBuckets() {
  const o = {};
  BUCKETS.forEach(b => o[b.key] = { p:0, s:0 });
  return o;
}

// El snapshot embebido y las cachés viejas pueden no tener todos los buckets.
function normBuckets(b) {
  const o = emptyBuckets();
  if (b) for (const k in o) if (b[k]) o[k] = { p:b[k].p||0, s:b[k].s||0 };
  return o;
}

// Carga real de QA: sólo las tarjetas que están en estados de QA
// ("Listo para QA" / "En QA") y asignadas a Lorena o Laura Mignanelli.
// Pendiente, en curso, bloqueado, reabierta y en revisión son de los devs.
const QA_MEMBER_IDS = new Set([174607180, 118075668]);
function emptyQa() { return { cola:0, porCaer:0, validado:0, reabiertas:0 }; }

async function loadCell(cell) {
  const res = { cell, lists:[], parents:0, subs:0, buckets:emptyBuckets(), qa:emptyQa(),
                byUser:{}, sinAsignar:0, error:null };
  if (!cell.space) return res;

  let lists = [...cell.lists];
  for (const f of cell.folders) lists.push(...await listsOfFolder(f));
  // ordenar por número de sprint si lo tiene
  lists.sort((a,b) => {
    const na = parseInt((a.name.match(/\d+/) || ['0'])[0]);
    const nb = parseInt((b.name.match(/\d+/) || ['0'])[0]);
    return na - nb;
  });

  // Las listas se piden en paralelo: en serie el panel tardaba ~90s por la paginación
  // de Sprint 8 (1.3k tarjetas) y Sprint 1 de Insumos.
  let failed = 0;
  const rows = await Promise.all(lists.map(async l => {
    try {
      const tasks = await tasksOfList(l.id);
      const row = { id:l.id, name:l.name, parents:0, subs:0, buckets:emptyBuckets(),
                    qa:emptyQa(), byUser:{}, sinAsignar:0 };
      for (const t of tasks) {
        const isSub = !!t.parent;
        const bk = bucketOf(t.status && t.status.status);
        if (isSub) { row.subs++; row.buckets[bk].s++; }
        else       { row.parents++; row.buckets[bk].p++; }

        // Cada tarjeta suma al dev que la tiene asignada
        const asig = t.assignees || [];
        if (!asig.length) row.sinAsignar++;
        for (const a of asig) row.byUser[a.id] = (row.byUser[a.id] || 0) + 1;

        const esDeQA = asig.some(a => QA_MEMBER_IDS.has(Number(a.id)));
        if (bk === 'qa') {
          if (esDeQA) row.qa.cola++;      // a probar por QA
          else        row.qa.porCaer++;   // en estado de QA pero todavía sin asignar a QA
        } else if (esDeQA) {
          if (bk === 'reabierta')      row.qa.reabiertas++;   // ya pasada a los devs
          else if (bk === 'terminado') row.qa.validado++;
        }
      }
      return row;
    } catch (e) {
      failed++;
      res.error = (res.error ? res.error + ' · ' : '') + `${l.name}: ${e.message}`;
      return null;
    }
  }));

  for (const row of rows.filter(Boolean)) {
    res.lists.push(row);
    res.parents += row.parents;
    res.subs    += row.subs;
    BUCKETS.forEach(b => { res.buckets[b.key].p += row.buckets[b.key].p; res.buckets[b.key].s += row.buckets[b.key].s; });
    res.qa.cola       += row.qa.cola;
    res.qa.porCaer    += row.qa.porCaer;
    res.qa.validado   += row.qa.validado;
    res.qa.reabiertas += row.qa.reabiertas;
    res.sinAsignar    += row.sinAsignar;
    for (const uid in row.byUser) res.byUser[uid] = (res.byUser[uid] || 0) + row.byUser[uid];
  }

  // Respaldo: sólo si el acceso al proxy está REALMENTE roto (token vencido, caída, CORS).
  // No se activa por 429 (ya se reintenta con backoff) ni por un módulo que
  // legítimamente devuelve 0 tarjetas: eso mostraba el cartel de "token vencido"
  // y los números del snapshot con el worker respondiendo 200.
  if (res.parents + res.subs === 0 && accesoRoto() && (failed > 0 || lists.length === 0)) {
    const rows = cell.folders.flatMap(f => SNAPSHOT.folders[f] || []);
    if (rows.length) {
      USED_SNAPSHOT = true;
      res.fromSnapshot = true;
      res.error = null;
      res.lists = rows.map(r => JSON.parse(JSON.stringify(r)))
        .sort((a,b) => parseInt((a.name.match(/\d+/)||['0'])[0]) - parseInt((b.name.match(/\d+/)||['0'])[0]));
      res.lists.forEach(r => { r.buckets = normBuckets(r.buckets); r.qa = r.qa || emptyQa(); });
      res.parents = res.lists.reduce((a,r) => a + r.parents, 0);
      res.subs    = res.lists.reduce((a,r) => a + r.subs, 0);
      res.buckets = emptyBuckets();
      res.qa = emptyQa();
      for (const r of res.lists) BUCKETS.forEach(b => { res.buckets[b.key].p += r.buckets[b.key].p; res.buckets[b.key].s += r.buckets[b.key].s; });
    }
  }
  return res;
}

// ---- Caché local: la primera pintura es instantánea y la API se refresca detrás
const CACHE_KEY = 'panelCelulas.v2';
const CACHE_TTL = 15 * 60 * 1000;

function emptyRow(cell) {
  return { cell, lists:[], parents:0, subs:0, buckets:emptyBuckets(), qa:emptyQa(),
           byUser:{}, sinAsignar:0, error:null };
}

function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      ts: Date.now(),
      cells: DATA.map(r => ({ module:r.cell.module, lists:r.lists, parents:r.parents,
                              subs:r.subs, buckets:r.buckets, qa:r.qa, byUser:r.byUser,
                              sinAsignar:r.sinAsignar, fromSnapshot:!!r.fromSnapshot }))
    }));
  } catch (e) { console.warn('cache save', e); }
}

function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (!c || !c.cells || Date.now() - c.ts > CACHE_TTL) return null;
    return c;
  } catch (e) { return null; }
}

async function loadAll(opts) {
  const background = !!(opts && opts.background);
  USED_SNAPSHOT = false;
  LAST_ERR = null;
  if (!background) {
    // placeholders + render incremental: cada célula aparece en cuanto termina,
    // en lugar de esperar a la más lenta (Contable Sprint 8).
    DATA = CELLS.map(emptyRow);
    document.getElementById('lastUpdated').textContent = 'Cargando datos de ClickUp…';
    render();
  } else {
    document.getElementById('lastUpdated').textContent += ' · actualizando…';
  }

  const results = new Array(CELLS.length);
  await Promise.all(CELLS.map(async (c, i) => {
    const res = await loadCell(c);
    results[i] = res;
    if (!background) { DATA[i] = res; render(); }
  }));

  DATA = results;
  document.getElementById('lastUpdated').textContent = USED_SNAPSHOT
    ? `⚠ Snapshot del ${SNAPSHOT.date} (${motivoCorto()})`
    : 'Actualizado ' + new Date().toLocaleString('es-AR');
  render();
  if (!USED_SNAPSHOT) saveCache();
}

const fmt = n => n.toLocaleString('es-AR');
function total(r) { return r.parents + r.subs; }
function baseline() { return DATA.find(r => r.cell.baseline) || { parents:0, subs:0, lists:[] }; }

// Carga de la célula QA: sólo tarjetas asignadas a QA, sin las reabiertas (esas ya están en devs)
function qaStats() {
  const real = DATA.filter(r => r.cell.space && !r.cell.qa);
  const out = { cola:0, porCaer:0, validado:0, reabiertas:0, modulos:real.length, porLista:[] };
  for (const r of real) {
    const q = Object.assign(emptyQa(), r.qa);
    out.cola += q.cola; out.porCaer += q.porCaer;
    out.validado += q.validado; out.reabiertas += q.reabiertas;
    for (const l of r.lists) {
      const lq = Object.assign(emptyQa(), l.qa);
      // Sólo lo asignado a QA: si no está a nombre de Lorena o Laura, no suma.
      if (lq.cola) out.porLista.push({ module:r.cell.module, name:l.name, ...lq });
    }
  }
  out.porLista.sort((a,b) => (b.cola - a.cola) || (b.porCaer - a.porCaer));
  return out;
}
function doneOf(r) { return r.buckets.terminado.p + r.buckets.terminado.s; }
function pctDone(r) { const t = total(r); return t ? Math.round(doneOf(r) * 100 / t) : 0; }

// byUser opcional: agrega a cada chip cuántas tarjetas tiene asignadas esa persona
function memberChips(ids, byUser) {
  return ids.map(id => {
    const p = PEOPLE[id] || { name:'?', short:'?', hex:'#666' };
    const n = byUser ? (byUser[id] || 0) : null;
    const tag = n === null ? '' : ` <b style="color:var(--text)">${fmt(n)}</b>`;
    return `<span class="member"><span class="av" style="background:${p.hex}">${p.short}</span>${p.name}${tag}</span>`;
  }).join('');
}

// Asignados que no son miembros de la célula (pasa en Sprint 8 del Contable)
function otherAssigneeChips(r) {
  const propios = new Set(r.cell.members.map(String));
  const otros = Object.keys(r.byUser || {}).filter(id => !propios.has(String(id)));
  if (!otros.length && !r.sinAsignar) return '';
  const chips = otros.sort((a,b) => r.byUser[b] - r.byUser[a]).map(id => {
    const p = PEOPLE[id] || { name:'ID ' + id, short:'?', hex:'#475569' };
    return `<span class="member"><span class="av" style="background:${p.hex}">${p.short}</span>${p.name} <b style="color:var(--text)">${fmt(r.byUser[id])}</b></span>`;
  }).join('');
  const sin = r.sinAsignar ? `<span class="member"><span class="av" style="background:#475569">—</span>sin asignar <b style="color:var(--text)">${fmt(r.sinAsignar)}</b></span>` : '';
  return `<div class="members" style="margin-top:6px;opacity:.8">${chips}${sin}</div>`;
}

function bucketBar(r) {
  const t = total(r);
  if (!t) return '<div class="bar"></div>';
  const segs = BUCKETS.map(b => {
    const v = r.buckets[b.key].p + r.buckets[b.key].s;
    return v ? `<div class="bar-seg" style="width:${v*100/t}%;background:${b.color}" title="${b.label}: ${v}"></div>` : '';
  }).join('');
  const leg = BUCKETS.map(b => {
    const v = r.buckets[b.key].p + r.buckets[b.key].s;
    return v ? `<span class="lg"><span class="dot" style="background:${b.color}"></span>${b.label} <b>${fmt(v)}</b></span>` : '';
  }).join('');
  return `<div class="bar">${segs}</div><div class="bar-legend">${leg}</div>`;
}

  const P = real.reduce((a,r) => a + r.parents, 0);
  const S = real.reduce((a,r) => a + r.subs, 0);
  const done = real.reduce((a,r) => a + doneOf(r), 0);
  const sprints = real.reduce((a,r) => a + r.lists.length, 0);
  const activas = DATA.filter(r => r.cell.space).length;
  const pend = CELLS.filter(c => !c.space && !c.qa).length;

  const cards = [
    { lbl:'Células', val:CELLS.length - 1 + ' + QA', sub:`${activas} con backlog · ${pend} sin space` },

    { lbl:'Terminado / cerrado', val:fmt(done), sub:`${P+S ? Math.round(done*100/(P+S)) : 0}% del total cargado` },

      </div>

}

      <div class="cell-num" style="background:${c.hex}">${c.n}</div>
      <div class="cell-title">
        <div class="mod">${c.module}${c.baseline?' <span class="tag" style="background:rgba(99,102,241,.2);color:#a5b4fc">baseline</span>':''}</div>
        <div class="sub">${c.url ? `<a class="link" href="${c.url}" target="_blank">${c.spaceName}</a>` : c.spaceName}</div>
      </div>
    </div>
    <div class="cell-body">
      <div class="members">${memberChips(c.members, has ? r.byUser : null)}</div>
      ${c.qa || !has ? '' : otherAssigneeChips(r)}
      ${c.qa ? qaLoad : `
      <div class="nums">
        <div class="num-box"><div class="n">${fmt(r.parents)}</div><div class="l">Tareas</div></div>
        <div class="num-box"><div class="n">${fmt(r.subs)}</div><div class="l">Subtareas</div></div>
        <div class="num-box"><div class="n">${r.lists.length}</div><div class="l">Sprints</div></div>
      </div>
      ${t ? `<div><div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">Avance — ${pctDone(r)}% terminado · ratio ${ratio} subtareas por tarea</div>${bucketBar(r)}</div>` : ''}
      ${vs}
      ${sprints}`}
      ${note}
      ${r.error ? `<div class="err">Error parcial: ${r.error}</div>` : ''}
    </div>
  </div>`;
}

function renderCelulas() {
  return `<div class="cells-grid">${DATA.map(cellCard).join('')}</div>`;
}

// ============================================================
// RENDER — Comparativa
// ============================================================
function renderComparativa() {
  const base = baseline();
  const baseT = base.parents + base.subs || 1;
  const rows = DATA.filter(r => r.cell.space);
  const max = Math.max(...rows.map(total), 1);

  const chart = `
  <div class="chart-card">
    <h2>Volumen de trabajo por módulo</h2>
    <div class="hint">Barra proporcional al total de tarjetas (tareas + subtareas). El Módulo Contable es la referencia: ${fmt(base.parents)} tareas y ${fmt(base.subs)} subtareas en ${base.lists.length} sprints.</div>
    ${rows.map(r => {
      const t = total(r);
      const w = t * 100 / max;
      const pw = t ? r.parents * 100 / t : 0;
      return `<div class="hbar-row">
        <div class="hbar-lbl"><span class="sq" style="background:${r.cell.hex}"></span>${r.cell.module}</div>
        <div class="hbar-outer">
          <div class="hbar-track" style="width:${w}%">
            <div class="hbar-p" style="width:${pw}%;background:${r.cell.hex}">${r.parents ? fmt(r.parents) : ''}</div>
            <div class="hbar-s" style="width:${100-pw}%;background:${r.cell.hex}66;color:var(--text)">${r.subs ? fmt(r.subs) : ''}</div>
          </div>
        </div>
        <div class="hbar-val"><b>${fmt(t)}</b> · ${Math.round(t*100/baseT)}% del Contable</div>
      </div>`;
    }).join('')}
    <div class="bar-legend" style="margin-top:14px">
      <span class="lg"><span class="dot" style="background:#6366f1"></span>Tareas padre (color pleno)</span>
      <span class="lg"><span class="dot" style="background:#6366f166"></span>Subtareas (color claro)</span>
    </div>
  </div>`;

  const head = `<tr>
    <th>Célula</th><th>Módulo</th><th>Integrantes</th>
    <th class="num">Sprints</th><th class="num">Tareas</th><th class="num">Subtareas</th><th class="num">Total</th>
    <th class="num">Subt/Tarea</th><th class="num">% vs Contable</th><th class="num">Terminado</th><th class="num">% avance</th>
  </tr>`;

  const body = DATA.map(r => {
    const c = r.cell;
    const t = total(r);
    if (c.qa) {
      const q = qaStats();
      const donde = q.porLista.filter(x => x.cola > 0).map(x => `${x.module} · ${x.name} (${fmt(x.cola)})`).join(' · ') || 'sin pendientes';
      return `<tr><td>QA</td><td>${c.module}</td><td>${c.members.map(i=>PEOPLE[i].name).join(', ')}</td>
        <td class="num" colspan="8" style="color:var(--text-muted)">Transversal — ${fmt(q.cola)} a probar (Listo para QA / En QA asignadas a QA) · ${fmt(q.validado)} validadas → ${donde}</td></tr>`;
    }
    if (!c.space) {
      return `<tr><td>${c.n}</td><td>${c.module}</td><td>${c.members.map(i=>PEOPLE[i].name).join(', ')}</td>
        <td class="num" colspan="8" style="color:var(--text-muted)">Sin space en ClickUp — backlog no cargado</td></tr>`;
    }
    return `<tr class="${c.baseline?'baseline':''}">
      <td>${c.n}</td><td>${c.module}</td><td>${c.members.map(i=>PEOPLE[i].name).join(', ')}</td>
      <td class="num">${r.lists.length}</td>
      <td class="num">${fmt(r.parents)}</td>
      <td class="num">${fmt(r.subs)}</td>
      <td class="num">${fmt(t)}</td>
      <td class="num">${r.parents ? (r.subs/r.parents).toFixed(1) : '—'}</td>
      <td class="num">${Math.round(t*100/baseT)}%</td>
      <td class="num">${fmt(doneOf(r))}</td>
      <td class="num">${pctDone(r)}%</td>
    </tr>`;
  }).join('');

  const real = DATA.filter(r => r.cell.space && !r.cell.qa);
  const tp = real.reduce((a,r)=>a+r.parents,0), ts = real.reduce((a,r)=>a+r.subs,0), td = real.reduce((a,r)=>a+doneOf(r),0);
  const foot = `<tr class="tot"><td colspan="3">TOTAL con backlog cargado</td>
    <td class="num">${real.reduce((a,r)=>a+r.lists.length,0)}</td>
    <td class="num">${fmt(tp)}</td><td class="num">${fmt(ts)}</td><td class="num">${fmt(tp+ts)}</td>
    <td class="num">${tp ? (ts/tp).toFixed(1) : '—'}</td><td class="num">—</td>
    <td class="num">${fmt(td)}</td><td class="num">${tp+ts ? Math.round(td*100/(tp+ts)) : 0}%</td></tr>`;

  return chart + `<div class="table-wrap"><table>${head}${body}${foot}</table></div>`;
}

// ============================================================
// RENDER — Detalle por sprint
// ============================================================
function renderDetalle() {
  const rows = DATA.filter(r => r.cell.space);
  if (!rows.length) return '<div class="note">No hay módulos con backlog cargado.</div>';
  return rows.map(r => `
    <div class="section-title"><span class="sq" style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${r.cell.hex}"></span>
      Célula ${r.cell.n} — ${r.cell.module}
      <span class="cnt">${r.lists.length} sprints · ${fmt(r.parents)} tareas · ${fmt(r.subs)} subtareas</span>
    </div>
    <div class="table-wrap"><table>
      <tr><th>Sprint / Lista</th><th class="num">Tareas</th><th class="num">Subtareas</th><th class="num">Total</th>
      ${BUCKETS.map(b=>`<th class="num">${b.label}</th>`).join('')}</tr>
      ${r.lists.map(l => `<tr>
        <td>${l.name}</td>
        <td class="num">${fmt(l.parents)}</td><td class="num">${fmt(l.subs)}</td><td class="num">${fmt(l.parents+l.subs)}</td>
        ${BUCKETS.map(b=>{const v=l.buckets[b.key].p+l.buckets[b.key].s; return `<td class="num" style="${v?`color:${b.color};font-weight:600`:'color:var(--text-muted)'}">${v?fmt(v):'—'}</td>`;}).join('')}
      </tr>`).join('')}
      <tr class="tot"><td>TOTAL ${r.cell.module}</td>
        <td class="num">${fmt(r.parents)}</td><td class="num">${fmt(r.subs)}</td><td class="num">${fmt(total(r))}</td>
        ${BUCKETS.map(b=>{const v=r.buckets[b.key].p+r.buckets[b.key].s; return `<td class="num">${v?fmt(v):'—'}</td>`;}).join('')}
      </tr>
    </table></div>`).join('');
}

// ============================================================
// RENDER dispatcher
// ============================================================
// ============================================================
// ESTADO DE SERVIDORES
// Lee estado-servidores.json, que publica el workflow "Estado de
// servidores" cada 5 minutos sondeando produccion, stage y devapp.
// ============================================================
let SRV = null;              // ultimo JSON leido
let SRV_TIMER = null;        // polling mientras el tab esta abierto
let SRV_AVISOS = localStorage.getItem('srvAvisos') === '1';

const SRV_ETIQUETA = {
  ok:         'En servicio',
  deployando: 'Deployando…',
  degradado:  'Degradado',
  caido:      'Caído'
};

function srvHace(iso) {
  if (!iso) return '—';
  const seg = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (seg < 90)   return `hace ${Math.round(seg)} s`;
  if (seg < 5400) return `hace ${Math.round(seg / 60)} min`;
  if (seg < 172800) return `hace ${Math.round(seg / 3600)} h`;
  return `hace ${Math.round(seg / 86400)} días`;
}

function srvHora(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

async function srvCargar() {
  try {
    const res = await fetch(`estado-servidores.json?v=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const nuevo = await res.json();
    // avisar en el navegador si algun ambiente cambio de estado desde la ultima lectura
    if (SRV && SRV_AVISOS) {
      for (const [id, a] of Object.entries(nuevo.ambientes || {})) {
        const antes = SRV.ambientes?.[id];
        if (antes && antes.estado !== a.estado) {
          srvNotificar(`${a.nombre}: ${SRV_ETIQUETA[a.estado] || a.estado}`, a.detalle || '');
        } else if (antes && a.ultimoDeploy && a.ultimoDeploy !== antes.ultimoDeploy) {
          srvNotificar(`${a.nombre}: deploy terminado`, a.detalle || '');
        }
      }
    }
    SRV = nuevo;
    srvPintarDot();
    return true;
  } catch (e) {
    SRV = SRV || { error: String(e.message || e) };
    return false;
  }
}

function srvPeor() {
  if (!SRV || !SRV.ambientes) return null;
  const orden = ['caido', 'deployando', 'degradado', 'ok'];
  return Object.values(SRV.ambientes).map(a => a.estado)
    .sort((x, y) => orden.indexOf(x) - orden.indexOf(y))[0] || null;
}

function srvPintarDot() {
  const dot = document.getElementById('srvDot');
  if (!dot) return;
  dot.className = 'srv-dot' + (srvPeor() ? ' ' + srvPeor() : '');
}

function srvNotificar(titulo, cuerpo) {
  try {
    if (window.Notification && Notification.permission === 'granted') {
      new Notification(titulo, { body: cuerpo });
    }
  } catch (_) { /* el navegador puede bloquearlo: el aviso de Discord sigue funcionando */ }
}

async function srvToggleAvisos() {
  if (!SRV_AVISOS && window.Notification && Notification.permission !== 'granted') {
    const p = await Notification.requestPermission();
    if (p !== 'granted') { alert('El navegador no dio permiso para notificar. Los avisos por Discord siguen funcionando igual.'); return; }
  }
  SRV_AVISOS = !SRV_AVISOS;
  localStorage.setItem('srvAvisos', SRV_AVISOS ? '1' : '0');
  render();
}

function renderServidores() {
  if (!SRV) return `<div class="loading"><div class="spinner"></div>Leyendo el estado de los servidores…</div>`;
  if (SRV.error) {
    return `<div class="err">No se pudo leer <code>estado-servidores.json</code> (${SRV.error}).
      Si es la primera vez, el archivo aparece después de la primera corrida del workflow
      <b>Estado de servidores</b> (pestaña Actions del repo, o esperando el cron de 5 minutos).</div>`;
  }
  const ambs = Object.entries(SRV.ambientes || {});
  const tarjetas = ambs.map(([id, a]) => `
    <div class="srv-card ${a.estado}">
      <h3><span class="srv-dot ${a.estado}"></span> ${a.nombre}</h3>
      <div class="srv-estado">${SRV_ETIQUETA[a.estado] || a.estado}</div>
      <div class="srv-meta">
        ${a.detalle ? `${a.detalle}<br>` : ''}
        En este estado desde <b>${srvHora(a.desde)}</b> (${srvHace(a.desde)})<br>
        Último chequeo: <b>${srvHace(a.ultimoChequeo)}</b> · HTTP ${a.httpStatus || '—'} · ${a.ms ? (a.ms / 1000).toFixed(1) + ' s' : '—'}<br>
        Build publicado: <b>${a.huella || '—'}</b>${a.ultimoDeploy ? ` · último deploy detectado ${srvHace(a.ultimoDeploy)}` : ''}<br>
        <a class="link" href="${a.url}" target="_blank" rel="noopener">${a.url.replace('https://', '')}</a>
      </div>
    </div>`).join('');

  const hist = (SRV.historial || []).slice(0, 30);
  const filas = hist.length
    ? hist.map(h => `<tr>
        <td class="cuando">${srvHora(h.cuando)}</td>
        <td><span class="srv-dot ${h.estado}"></span> ${SRV.ambientes?.[h.ambiente]?.nombre || h.ambiente}</td>
        <td>${h.deployTermino ? '<b>Deploy terminado</b> · ' : ''}${h.detalle || SRV_ETIQUETA[h.estado] || h.estado}</td>
      </tr>`).join('')
    : `<tr><td colspan="3" style="color:var(--muted)">Todavía no hubo cambios de estado registrados.</td></tr>`;

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <h2 class="section-title" style="margin:0">Estado de los ambientes</h2>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="last-updated">Sondeo automático cada 5 min · última lectura ${srvHace(SRV.actualizado)}</span>
        <button class="srv-alert-btn ${SRV_AVISOS ? 'on' : ''}" onclick="srvToggleAvisos()">
          ${SRV_AVISOS ? '🔔 Avisos activados' : '🔕 Avisarme en este navegador'}
        </button>
      </div>
    </div>
    <div class="srv-grid">${tarjetas}</div>
    <h2 class="section-title">Últimos movimientos</h2>
    <div class="srv-hist">
      <table>
        <thead><tr><th>Cuándo</th><th>Ambiente</th><th>Qué pasó</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
    <div class="note" style="margin-top:14px">
      <b>Cómo se detecta.</b> Un sondeo automático consulta los tres ambientes cada 5 minutos:
      si el servidor devuelve 502/503/504 es que el contenedor está reiniciando (<b>deployando</b>);
      si no responde, está <b>caído</b>; y cuando vuelve a responder con una versión distinta
      (cambia la huella del build), se registra que el <b>deploy terminó</b>.
      Los avisos llegan al canal de Discord aunque el panel esté cerrado; el botón de arriba
      agrega además una notificación del navegador mientras esta página esté abierta.
    </div>`;
}

// El cartel debe decir la causa real: antes atribuía cualquier fallo a
// "token del worker vencido" y aparecía con el worker respondiendo 200.
function causaFallo() {
  if (LAST_ERR === 401 || LAST_ERR === 403)
    return 'El worker de ClickUp devolvió <b>HTTP ' + LAST_ERR + '</b>: el token está vencido. Renovar el secret <code>CLICKUP_API_TOKEN</code> del worker (<code>wrangler secret put</code> en <code>panel-bugs/</code>) y el panel vuelve a actualizarse solo.';
  if (LAST_ERR === 429)
    return 'ClickUp está limitando por volumen de pedidos (<b>HTTP 429</b>). El token está bien: reintentar con <b>Actualizar</b> en un minuto.';
  if (LAST_ERR === 'red')
    return 'No se pudo llegar al worker de ClickUp (red o CORS).';
  if (typeof LAST_ERR === 'number')
    return 'El worker de ClickUp devolvió <b>HTTP ' + LAST_ERR + '</b>.';
  return 'El proxy de ClickUp no devolvió datos para algún módulo.';
}
function motivoCorto() {
  if (LAST_ERR === 401 || LAST_ERR === 403) return 'token del worker vencido';
  if (LAST_ERR === 429) return 'rate limit de ClickUp';
  if (LAST_ERR === 'red') return 'worker inalcanzable';
  if (typeof LAST_ERR === 'number') return 'HTTP ' + LAST_ERR;
  return 'proxy sin responder';
}

function render() {
  renderTotalizers();
  const el = document.getElementById('content');
  const banner = USED_SNAPSHOT
    ? `<div class="err">${causaFallo()} Se muestran los números del <b>snapshot del ${SNAPSHOT.date}</b>.</div>`
    : '';
  if (currentTab === 'celulas')     el.innerHTML = banner + renderCelulas();
  else if (currentTab === 'comparativa') el.innerHTML = banner + renderComparativa();
  else if (currentTab === 'servidores')  el.innerHTML = renderServidores();
  else                              el.innerHTML = banner + renderDetalle();
}

// ============================================================
// EXPORT CSV
// ============================================================
function exportCsv() {
  const base = baseline();
  const baseT = base.parents + base.subs || 1;
  const lines = [['Celula','Modulo','Integrantes','Sprint','Tareas','Subtareas','Total','% vs Contable','Terminado'].join(';')];
  for (const r of DATA) {
    const nm = r.cell.members.map(i => PEOPLE[i].name).join(' / ');
    if (!r.cell.space) { lines.push([r.cell.n, r.cell.module, nm, '', '', '', '', '', ''].join(';')); continue; }
    for (const l of r.lists) {
      lines.push([r.cell.n, r.cell.module, nm, l.name, l.parents, l.subs, l.parents+l.subs, '', ''].join(';'));
    }
    lines.push([r.cell.n, r.cell.module + ' (TOTAL)', nm, '', r.parents, r.subs, total(r),
      Math.round(total(r)*100/baseT) + '%', doneOf(r)].join(';'));
  }
  const blob = new Blob(['﻿' + lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'panel-celulas-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// ============================================================
// EVENTS
// ============================================================
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', async () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentTab = t.dataset.tab;
  render();
  // el tab de servidores se refresca solo cada 60 s mientras esta abierto
  clearInterval(SRV_TIMER); SRV_TIMER = null;
  if (currentTab === 'servidores') {
    await srvCargar(); render();
    SRV_TIMER = setInterval(async () => {
      if (await srvCargar() && currentTab === 'servidores') render();
    }, 60000);
  }
}));

// lectura inicial en segundo plano: pinta el semaforo del tab y habilita los avisos
srvCargar().then(() => { srvPintarDot(); if (currentTab === 'servidores') render(); });
setInterval(() => { if (currentTab !== 'servidores') srvCargar(); }, 300000);
document.getElementById('refreshBtn').addEventListener('click', () => loadAll());
document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);

const cached = readCache();
if (cached) {
  DATA = CELLS.map(c => {
    const row = cached.cells.find(x => x.module === c.module);
    if (!row) return emptyRow(c);
    (row.lists || []).forEach(l => { l.buckets = normBuckets(l.buckets); l.qa = l.qa || emptyQa(); });
    return { cell:c, lists:row.lists || [], parents:row.parents, subs:row.subs,
             buckets:normBuckets(row.buckets), qa:Object.assign(emptyQa(), row.qa),
             byUser:row.byUser || {}, sinAsignar:row.sinAsignar || 0,
             error:null, fromSnapshot:row.fromSnapshot };
  });
  document.getElementById('lastUpdated').textContent =
    'Caché ' + new Date(cached.ts).toLocaleString('es-AR');
  render();
  loadAll({ background:true });
} else {
  loadAll();
}
setInterval(() => loadAll({ background:true }), 5 * 60 * 1000);
</script>
